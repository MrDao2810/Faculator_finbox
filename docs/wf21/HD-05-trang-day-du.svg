<title>Hướng dẫn từng công thức — trang đầy đủ /huong-dan/cong-thuc/&lt;id&gt;/</title>
<defs><marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5b9ae8"/></marker></defs>
<text x="56" y="52" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#e6ecf7">Hướng dẫn từng công thức — trang đầy đủ /huong-dan/cong-thuc/&lt;id&gt;/</text>
<text x="56" y="78" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a99b5">&quot;trong hướng dẫn sử dụng có link để bấm vào các phần&quot; → mỗi mục một neo, mục lục bám dính, và mọi mục đều mở được màn thật rồi quay lại.</text>
<rect x="56" y="118" width="26" height="26" fill="#16281f" rx="6" stroke="#3f8f6a" stroke-width="1"/>
<text x="69" y="136" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3f8f6a" text-anchor="middle">A</text>
<text x="94" y="136" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6ecf7">Trang đầy đủ — hai cột</text>
<text x="294.2" y="136" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a99b5">— bài 880px bên trái, mục lục 400px bám dính bên phải</text>
<rect x="56" y="160" width="1568" height="940" fill="#0f1523" rx="10" stroke="#212c40" stroke-width="1"/>
<rect x="56" y="160" width="1568" height="28" fill="#141c2b" rx="10"/>
<rect x="56" y="178" width="1568" height="10" fill="#141c2b" rx="0"/>
<circle cx="72" cy="174" r="4" fill="#3d4863"/>
<circle cx="86" cy="174" r="4" fill="#3d4863"/>
<circle cx="100" cy="174" r="4" fill="#3d4863"/>
<text x="118" y="178" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5d6c88">faculator · /huong-dan/cong-thuc/pe/#ket-qua-trong   ← URL thật: Back được, copy gửi được, in được</text>
<rect x="56" y="188" width="1568" height="46" fill="#141c2b" rx="0"/>
<path d="M56 234L1624 234" stroke="#212c40" stroke-width="1"/>
<text x="72" y="216" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#c3cee1">Faculator Finbox</text>
<text x="226" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#c3cee1">Công thức</text>
<text x="312" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">Danh mục</text>
<text x="398" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">Cài đặt</text>
<text x="484" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">Giới thiệu</text>
<text x="1526" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#8a99b5" text-anchor="middle">?</text>
<text x="1562" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">VI</text>
<text x="1594" y="216" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a99b5">☀</text>
<rect x="56" y="234" width="1568" height="38" fill="#131a28" rx="0"/>
<path d="M56 272L1624 272" stroke="#212c40" stroke-width="1"/>
<text x="236" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#5b9ae8">‹  Quay lại P/E</text>
<text x="376" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5d6c88">Hướng dẫn  ›  Công thức  ›  P/E</text>
<text x="180" y="318" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#e6ecf7">P/E — cách dùng</text>
<text x="180" y="344" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6c88">Hệ số giá trên lợi nhuận · nhóm Chỉ số doanh nghiệp · mức Cơ bản</text>
<path d="M180 364L1060 364" stroke="#212c40" stroke-width="1"/>
<text x="180" y="400" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ecf7"># Dùng để làm gì</text>
<text x="1060" y="400" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4863" text-anchor="end">🔗</text>
<text x="180" y="426" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#c3cee1">Nhà đầu tư trả bao nhiêu đồng cho mỗi đồng lợi nhuận của doanh nghiệp.</text>
<text x="180" y="448" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#c3cee1">Dùng khi bạn đang xem một cổ phiếu và muốn biết giá của nó đắt hay rẻ so với lợi nhuận công ty</text>
<text x="180" y="468" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#c3cee1">làm ra, nhất là khi so hai công ty cùng ngành.</text>
<text x="180" y="512" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ecf7"># Cần số gì</text>
<text x="1060" y="512" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4863" text-anchor="end">🔗</text>
<rect x="180" y="538" width="880" height="30" fill="#182031" rx="0"/>
<text x="192" y="557" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">Ô NHẬP</text>
<text x="442" y="557" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">ĐƠN VỊ</text>
<text x="512" y="557" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">LẤY CON SỐ NÀY Ở ĐÂU</text>
<rect x="180" y="568" width="880" height="38" fill="none" rx="0"/>
<path d="M180 606L1060 606" stroke="#1e2739" stroke-width="1"/>
<text x="192" y="592" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3cee1">Giá thị trường</text>
<text x="442" y="592" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">₫</text>
<text x="512" y="592" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Giá đóng cửa gần nhất của một cổ phiếu.</text>
<rect x="180" y="606" width="880" height="38" fill="#131a28" rx="0"/>
<path d="M180 644L1060 644" stroke="#1e2739" stroke-width="1"/>
<text x="192" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#c3cee1">EPS — lợi nhuận trên mỗi cổ phiếu</text>
<text x="442" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">₫</text>
<text x="512" y="630" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Lợi nhuận sau thuế chia cho số cổ phiếu đang lưu hành.</text>
<rect x="180" y="658" width="18" height="18" fill="#1a2740" rx="4"/>
<text x="189" y="671" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5b9ae8" text-anchor="middle">↗</text>
<text x="208" y="671" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b9ae8">EPS có công thức riêng trong thư viện — mở EPS cơ bản</text>
<text x="180" y="695" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5d6c88">Hai ô đều hiện ở mức Cơ bản. Công thức này không cần chuỗi giá và không dùng hằng số nào.</text>
<text x="180" y="732" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ecf7"># Nạp số</text>
<text x="1060" y="732" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4863" text-anchor="end">🔗</text>
<rect x="180" y="758" width="284" height="86" fill="#141c2b" rx="8" stroke="#212c40" stroke-width="1"/>
<rect x="194" y="772" width="20" height="20" fill="#16281f" rx="10" stroke="#3f8f6a" stroke-width="1"/>
<text x="204" y="786" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#3f8f6a" text-anchor="middle">1</text>
<text x="224" y="786" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf7">Nạp mẫu</text>
<text x="194" y="812" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">Một bộ số có sẵn của mã thật, bấm một</text>
<text x="194" y="829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">nút là đủ cả hai ô.</text>
<rect x="478" y="758" width="284" height="86" fill="#141c2b" rx="8" stroke="#212c40" stroke-width="1"/>
<rect x="492" y="772" width="20" height="20" fill="#16281f" rx="10" stroke="#3f8f6a" stroke-width="1"/>
<text x="502" y="786" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#3f8f6a" text-anchor="middle">2</text>
<text x="522" y="786" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf7">Theo mã</text>
<text x="492" y="812" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">Gõ mã ở ô chọn mã: giá lấy từ phiên</text>
<text x="492" y="829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">gần nhất, EPS gõ tay.</text>
<rect x="776" y="758" width="284" height="86" fill="#141c2b" rx="8" stroke="#212c40" stroke-width="1"/>
<rect x="790" y="772" width="20" height="20" fill="#16281f" rx="10" stroke="#3f8f6a" stroke-width="1"/>
<text x="800" y="786" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#3f8f6a" text-anchor="middle">3</text>
<text x="820" y="786" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#e6ecf7">Gõ tay</text>
<text x="790" y="812" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">Bấm thẳng vào ô, kết quả đổi ngay khi</text>
<text x="790" y="829" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#8a99b5">gõ.</text>
<text x="180" y="864" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ecf7"># Khi kết quả hiện  _ _</text>
<text x="1060" y="864" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4863" text-anchor="end">🔗</text>
<rect x="180" y="890" width="880" height="72" fill="#2a2318" rx="8" stroke="#d99b3c" stroke-width="1"/>
<rect x="180" y="890" width="3" height="72" fill="#d99b3c" rx="0"/>
<text x="198" y="914" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#c3cee1">⚠  Chưa tính được P/E vì EPS bằng 0.</text>
<text x="198" y="936" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">Cách sửa: Nhập EPS khác 0 hoặc chọn kỳ khác. Doanh nghiệp không có lợi nhuận trên mỗi cổ phiếu ở kỳ này.</text>
<text x="1046" y="914" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#d99b3c" text-anchor="end">EPS = 0</text>
<rect x="180" y="974" width="880" height="72" fill="#2a2318" rx="8" stroke="#d99b3c" stroke-width="1"/>
<rect x="180" y="974" width="3" height="72" fill="#d99b3c" rx="0"/>
<text x="198" y="998" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#c3cee1">⚠  P/E không có ý nghĩa khi doanh nghiệp đang lỗ.</text>
<text x="198" y="1020" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#8a99b5">Cách sửa: Dùng P/B hoặc P/S để thay thế.</text>
<text x="1046" y="998" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#d99b3c" text-anchor="end">EPS âm</text>
<text x="180" y="1068" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#e6ecf7"># Sai lầm thường gặp</text>
<text x="1060" y="1068" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#3d4863" text-anchor="end">🔗</text>
<text x="180" y="1094" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#c3cee1">So P/E giữa hai ngành khác nhau, hoặc dùng P/E cho doanh nghiệp có lợi nhuận bất thường hay đang lỗ.</text>
<rect x="1100" y="364" width="400" height="320" fill="#0f1523" rx="10" stroke="#212c40" stroke-width="1"/>
<text x="1120" y="388" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">TRONG BÀI NÀY</text>
<text x="1480" y="388" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#3d4863" text-anchor="end">(dính khi cuộn)</text>
<text x="1124" y="420" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Dùng để làm gì</text>
<text x="1124" y="446" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Cần số gì</text>
<text x="1124" y="472" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Nạp số</text>
<text x="1124" y="498" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Đọc kết quả</text>
<rect x="1112" y="508" width="376" height="24" fill="#1a2740" rx="4"/>
<rect x="1112" y="508" width="2" height="24" fill="#5b9ae8" rx="0"/>
<text x="1124" y="524" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e6ecf7">Khi kết quả hiện  _ _</text>
<text x="1124" y="550" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Sai lầm thường gặp</text>
<path d="M1116 576L1484 576" stroke="#212c40" stroke-width="1"/>
<text x="1120" y="600" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">MỞ MÀN THẬT</text>
<text x="1124" y="624" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b9ae8">↗  Tính P/E với số của bạn</text>
<text x="1124" y="646" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b9ae8">↗  Ví dụ thực tế — FPT</text>
<text x="1124" y="668" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5b9ae8">↗  Bài tập — 5 câu</text>
<rect x="1100" y="700" width="400" height="118" fill="#0f1523" rx="10" stroke="#212c40" stroke-width="1"/>
<text x="1120" y="726" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.1" fill="#5d6c88">CÔNG THỨC LIÊN QUAN</text>
<text x="1124" y="750" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">P/B — giá trên giá trị sổ sách</text>
<text x="1124" y="772" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">P/S — giá trên doanh thu</text>
<text x="1124" y="794" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">EPS cơ bản</text>
<path d="M1074 518L1106 518" stroke="#5b9ae8" stroke-width="1.5" fill="none" marker-end="url(#mui)"/>
<text x="70" y="1126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a99b5"></text>
<rect x="56" y="1119" width="3" height="3" fill="#8a99b5" rx="0"/>
<text x="68" y="1126" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Mục đang đọc tự sáng ở mục lục và tự ghi vào URL bằng history.replaceState — KHÔNG push, nếu không nút Back thành bãi rác.</text>
<rect x="56" y="1139" width="3" height="3" fill="#8a99b5" rx="0"/>
<text x="68" y="1146" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Mỗi tiêu đề có biểu tượng 🔗 copy thẳng link của riêng mục đó: đúng vế &quot;có link để bấm vào các phần&quot;.</text>
<rect x="56" y="1159" width="3" height="3" fill="#8a99b5" rx="0"/>
<text x="68" y="1166" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Hai thẻ vàng in NGUYÊN câu cảnh báo và câu &quot;Cách sửa&quot; mà chính calc viết — chạy lại lúc build, không chép tay.</text>
<rect x="56" y="1179" width="3" height="3" fill="#8a99b5" rx="0"/>
<text x="68" y="1186" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#8a99b5">Dưới 1280px mục lục co thành một hàng gấp mở, mặc định mở; bài vẫn một cột. Khổ điện thoại làm sau.</text>
<rect x="56" y="1234" width="26" height="26" fill="#132626" rx="6" stroke="#3f8f8f" stroke-width="1"/>
<text x="69" y="1252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#3f8f8f" text-anchor="middle">B</text>
<text x="94" y="1252" font-family="Be Vietnam Pro, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6ecf7">Bài dựng lúc build, nằm trong vỏ service worker</text>
<text x="521.7" y="1252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#8a99b5">— hướng dẫn mà cần mạng thì đúng lúc cần nhất lại không có</text>
